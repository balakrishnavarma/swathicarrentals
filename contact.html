<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Swathi Car Rentals</title>
    <link rel="stylesheet" href="css/style.css?v=43">
    <link rel="stylesheet" href="css/responsive.css?v=43">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .contact-container {
            display: flex;
            justify-content: center;
            margin-top: 40px;
        }
        .contact-info {
            width: 100%;
            max-width: 800px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .contact-card {
            background: var(--color-bg-card);
            padding: 30px;
            border-radius: var(--border-radius-md);
            height: 100%;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: var(--shadow-sm);
        }
        .contact-card i {
            font-size: 2rem;
            color: var(--color-accent);
        }
        .contact-card h3 {
            margin-bottom: 5px;
        }
        .contact-card p {
            color: var(--color-text-light);
            margin: 0;
        }
        .contact-form-wrapper {
            background: white;
            padding: 40px;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-md);
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    
    <main style="min-height: 70vh;" class="section-padding container">
        <div class="text-center">
            <h1 class="text-accent">Get In Touch</h1>
            <p>Have questions? We'd love to hear from you.</p>
        </div>

        <div class="contact-container">
            <div class="contact-info">
                <a href="https://www.google.com/maps/search/?api=1&query=20-149,+Kalidindi+Vari+Street,+Gowri+Shankar+Nagar,+Sri+Ramachandra+Nagar,+Kanuru,+Andhra+Pradesh+520007" target="_blank" style="text-decoration: none; color: inherit; display: block; height: 100%;">
                    <div class="contact-card" style="cursor: pointer; transition: transform 0.3s ease;">
                        <i class="fas fa-map-marker-alt"></i>
                        <div>
                            <h3>Our Office</h3>
                            <p>20-149, Kalidindi Vari Street, Gowri Shankar Nagar, Sri Ramachandra Nagar, Kanuru, Andhra Pradesh 520007 <br><span style="font-size: 0.85rem; color: var(--color-accent);">Click to view on Map</span></p>
                        </div>
                    </div>
                </a>
                <a href="tel:+917981372766" style="text-decoration: none; color: inherit; display: block; height: 100%;">
                    <div class="contact-card" style="cursor: pointer; transition: transform 0.3s ease;">
                        <i class="fas fa-phone-alt"></i>
                        <div>
                            <h3>Call Us</h3>
                            <p>+91 79813 72766</p>
                        </div>
                    </div>
                </a>
                <div class="contact-card">
                    <i class="fas fa-envelope"></i>
                    <div>
                        <h3>Email Us</h3>
                        <p>swathicarrentals@gmail.com</p>
                    </div>
                </div>
                <a href="https://api.whatsapp.com/send?phone=917981372766&text=Hi%2C%20I%20have%20an%20enquiry%20about%20%2ASWATHI%20CAR%20RENTALS%2A.%0A%0AI%27m%20interested%20in%20renting%20a%20car.%20Could%20you%20please%20share%20the%20available%20cars%2C%20rental%20prices%2C%20and%20booking%20details%3F" target="_blank" style="text-decoration: none; color: inherit; display: block; height: 100%;">
                    <div class="contact-card" style="background: #25D366; color: white; cursor: pointer; transition: transform 0.3s ease;">
                        <i class="fab fa-whatsapp" style="color: white;"></i>
                        <div>
                            <h3 style="color: white;">WhatsApp</h3>
                            <p style="color: white;">Available 24/7 for Bookings</p>
                        </div>
                    </div>
                </a>
            </div>


        </div>
    </main>

    <div id="footer-container"></div>
    <script src="js/main.js?v=50"></script>
</body>
</html>
